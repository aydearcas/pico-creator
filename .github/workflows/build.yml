name: Verify and build PICO Creator
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'examples/**', 'skills/**', 'lib/**', 'types/**', '*schema.json', 'package*.json', 'vite*.config.js', '.github/workflows/build.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Library in lib/ matches the source
        shell: bash
        run: |
          npm run build:lib
          if ! git diff --exit-code --stat -- lib; then
            echo "::error title=lib/ is out of date::Run npm run build:lib and commit lib/"
            exit 1
          fi
      - name: Run npm test
        shell: bash
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee test-output.txt; then
            # Surface failing tests as one annotation (readable without downloading logs).
            summary=$(grep -E -A14 '^not ok' test-output.txt | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=npm test failed::${summary}"
            exit 1
          fi
      - name: Export verified public build
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib
          data=pathlib.Path('dist/index.html').read_bytes()
          digest=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          print('PICO_BUILD_SHA:'+digest)
          encoded=base64.b64encode(gzip.compress(data,mtime=0)).decode()
          for i in range(0,len(encoded),8000): print('PICO_BUILD_PART:'+encoded[i:i+8000])
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pico-creator-build
          path: dist/index.html
          retention-days: 7
